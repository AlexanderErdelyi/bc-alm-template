<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview card (1280x640). Export: npx sharp-cli -i ./media/social-preview.svg -o ./media/social-preview.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D5C"/>
      <stop offset="1" stop-color="#062233"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#0B3D5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#0E7C86" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E7C86" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="8" fill="#7FE3D9"/>

  <!-- BC ALM icon -->
  <g transform="translate(110 170)">
    <rect width="270" height="270" rx="56" fill="url(#tile)" stroke="#7FE3D9" stroke-opacity="0.35" stroke-width="2"/>
    <g transform="translate(135 135) scale(8.9) translate(-12 -12)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <path d="M17.5 14v7M14 17.5h7" stroke="#7FE3D9"/>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="450" y="236" font-size="22" font-weight="600" letter-spacing="3" fill="#7FE3D9">MICROSOFT DYNAMICS 365 BUSINESS CENTRAL</text>
    <text x="446" y="326" font-size="80" font-weight="700" fill="#FFFFFF">BC ALM Template</text>
    <text x="450" y="390" font-size="34" fill="#D6E7EE">Spec-driven Business Central development</text>
    <text x="450" y="434" font-size="34" fill="#D6E7EE">with GitHub Copilot agents</text>

    <!-- Marketplace pill -->
    <g transform="translate(450 476)">
      <rect width="470" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.08" stroke="#7FE3D9" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M24 18l12 10-12 10" fill="none" stroke="#7FE3D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="37" font-size="24" font-weight="600" fill="#FFFFFF">VS Code Marketplace · BC ALM</text>
    </g>

    <text x="1170" y="596" font-size="22" text-anchor="end" fill="#8FB3C4">github.com/AlexanderErdelyi/bc-alm-template</text>
    <text x="110" y="596" font-size="22" fill="#8FB3C4">Agents · Skills · Prompts · Instructions</text>
  </g>
</svg>
