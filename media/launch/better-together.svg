<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- LinkedIn feed image (4:5): plugins + BC ALM. Export: npx sharp-cli -i ./media/launch/better-together.svg -o ./media/launch/better-together.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3D5C"/>
      <stop offset="1" stop-color="#062233"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="8" fill="#7FE3D9"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="100" font-size="24" font-weight="600" letter-spacing="3" fill="#7FE3D9">PLUGINS OR BC ALM?</text>
    <text x="76" y="190" font-size="80" font-weight="700" fill="#FFFFFF">Why not both?</text>
    <text x="80" y="252" font-size="30" fill="#D6E7EE">Plugins for what's the same everywhere.</text>
    <text x="80" y="296" font-size="30" fill="#D6E7EE">BC ALM for what changes per customer.</text>

    <!-- Plugins card -->
    <g transform="translate(80 350)">
      <rect width="440" height="620" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
      <text x="40" y="80" font-size="44" font-weight="700" fill="#FFFFFF">Plugins</text>
      <text x="40" y="120" font-size="22" font-weight="600" letter-spacing="2" fill="#8FB3C4">SHARED EVERYWHERE</text>
      <g font-size="25" fill="#E6F1F5">
        <circle cx="50" cy="196" r="7" fill="#8FB3C4"/><text x="72" y="205">Company-wide standards</text>
        <circle cx="50" cy="276" r="7" fill="#8FB3C4"/><text x="72" y="285">MCP servers &amp; tools</text>
        <circle cx="50" cy="356" r="7" fill="#8FB3C4"/><text x="72" y="365">Same base for every dev</text>
        <circle cx="50" cy="436" r="7" fill="#8FB3C4"/><text x="72" y="445">Install once, use in any repo</text>
        <circle cx="50" cy="516" r="7" fill="#8FB3C4"/><text x="72" y="525">Stable and versioned</text>
      </g>
    </g>

    <!-- BC ALM card -->
    <g transform="translate(560 350)">
      <rect width="440" height="620" rx="28" fill="#7FE3D9" fill-opacity="0.10" stroke="#7FE3D9" stroke-opacity="0.6" stroke-width="2"/>
      <text x="40" y="80" font-size="44" font-weight="700" fill="#FFFFFF">BC ALM</text>
      <text x="40" y="120" font-size="22" font-weight="600" letter-spacing="2" fill="#7FE3D9">TAILORED PER REPO</text>
      <g font-size="25" fill="#E6F1F5">
        <circle cx="50" cy="196" r="7" fill="#7FE3D9"/><text x="72" y="205">Pick your agents &amp; skills</text>
        <circle cx="50" cy="276" r="7" fill="#7FE3D9"/><text x="72" y="285">Customer-specific workflows</text>
        <circle cx="50" cy="356" r="7" fill="#7FE3D9"/><text x="72" y="365">Enable, disable, pin, swap</text>
        <circle cx="50" cy="436" r="7" fill="#7FE3D9"/><text x="72" y="445">Keep your edits on update</text>
        <circle cx="50" cy="516" r="7" fill="#7FE3D9"/><text x="72" y="525">Try the new way today</text>
      </g>
    </g>

    <!-- plus -->
    <circle cx="540" cy="660" r="40" fill="#0B3D5C" stroke="#7FE3D9" stroke-width="3"/>
    <path d="M540 638v44M518 660h44" stroke="#7FE3D9" stroke-width="6" stroke-linecap="round"/>

    <!-- result -->
    <rect x="80" y="1020" width="920" height="170" rx="28" fill="#7FE3D9"/>
    <text x="120" y="1092" font-size="38" font-weight="700" fill="#0B3D5C">= A shared foundation for the team.</text>
    <text x="150" y="1150" font-size="38" font-weight="700" fill="#0B3D5C">Freedom for every customer project.</text>

    <text x="80" y="1290" font-size="24" fill="#8FB3C4">BC ALM for VS Code · Business Central · GitHub Copilot</text>
  </g>
</svg>
