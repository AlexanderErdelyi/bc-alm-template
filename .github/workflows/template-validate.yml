name: Template validate

# Validates the template catalog: the root template "bc-alm" and every .templates/<id>/ template.
# - manifests: id equals folder, unique ids, semver version, extends/remove targets, no cycles
# - agents/skills/prompts/instructions: the BC ALM extension's validator (frontmatter, description, names, handoffs)
# - pull requests: a changed .templates/<id>/ must bump template.version and add a CHANGELOG.md section
# Template-repo only: projects created from the template drop this workflow.

on:
  # Every PR runs the validation so "validate" can be a required status check on main.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".templates/**"
      - ".github/agents/**"
      - ".github/skills/**"
      - ".github/prompts/**"
      - ".github/instructions/**"
      - "template.config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build validator
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile

      - name: Validate templates
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node vscode-extension/out/src/cli/validate.js --root . --base "$BASE_REF"
          else
            node vscode-extension/out/src/cli/validate.js --root .
          fi
