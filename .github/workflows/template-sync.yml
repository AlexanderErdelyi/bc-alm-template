name: Template sync

# Pulls updates from the bc-alm-template repository and opens a pull request with
# the changes. This runs Update-FromTemplate.ps1 (.bc-alm/scripts/, or scripts/ in the
# classic layout), so it honors the 'sync' block in template.config.json exactly like a local run:
#   * customizationsPath - refreshes the relocated .github/agents|skills|instructions
#   * updateModels        - re-applies your agent 'model:' choices when false
#   * updateExtensions    - keeps your .vscode/extensions.json when false
#   * updateInstructions  - keeps your .github/instructions when false
#   * components          - disabled / keepLocal component ids are skipped
# Your AL code, specs, PROJECT.md and token-injected files are never touched.
# template.lock.json (committed with the PR) records the synced baseline; files you
# edited since the last sync are kept and listed in the run log instead of overwritten.
# The template URL and branch default to the lock's first source (falls back to main).
#
# Runs weekly and on demand from the Actions tab (Run workflow). Review the PR it
# opens, resolve anything you want to keep, then merge.

on:
  schedule:
    # 06:00 UTC every Monday
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-sync:
    runs-on: ubuntu-latest
    # Don't sync the template against itself.
    if: github.repository != 'AlexanderErdelyi/bc-alm-template'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Refresh template-managed files (honors template.config.json sync block)
        shell: pwsh
        run: |
          if (Test-Path ./.bc-alm/scripts/Update-FromTemplate.ps1) { ./.bc-alm/scripts/Update-FromTemplate.ps1 }
          else { ./scripts/Update-FromTemplate.ps1 }

      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/template-sync
          delete-branch: true
          commit-message: "chore(template): sync updates from bc-alm-template"
          title: "chore(template): sync updates from bc-alm-template"
          labels: template-sync
          body: |
            Automated update from
            [bc-alm-template](https://github.com/AlexanderErdelyi/bc-alm-template).

            Refreshed via `Update-FromTemplate.ps1`, which honors the `sync`
            block in `template.config.json` (customizations location + model/toolset
            toggles, per-component disabled/keepLocal policy). Files you edited locally since
            the last sync are kept (see the workflow log), and `template.lock.json` records the
            new baseline. Your AL code, specs, and configured values are untouched.

            Review the diff and merge what you want to keep.
